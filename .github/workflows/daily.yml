name: RUFFLUX daily

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run a generation even if there are no new bars"
        type: boolean
        default: false
      reset_halt:
        description: "HUMAN OPERATOR ONLY: clear a latched HALT"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rufflux
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests must pass before the lab runs
        run: python -m unittest discover -s tests
      - name: Run lab (simulation only)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.reset_halt }}" = "true" ]; then ARGS="$ARGS --reset-halt"; fi
          python -m rufflux.runner $ARGS
      - name: Commit state, data and dashboard
        run: |
          git config user.name "rufflux-bot"
          git config user.email "rufflux-bot@users.noreply.github.com"
          git add -A state data docs
          git diff --cached --quiet || git commit -m "RUFFLUX daily run $(date -u +%F)"
          git push
